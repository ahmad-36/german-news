<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <rect width="960" height="700" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="19" font-weight="700" fill="#0f172a">News dataset pipeline</text>

  <!-- stages -->
  <g>
    <rect x="40" y="56" width="340" height="62" rx="9" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="58" y="80" font-size="14" font-weight="700" fill="#1e1b4b">1 · COLLECTION</text>
    <text x="58" y="101" font-size="12.5" fill="#3730a3">crawl / API pull — by date, topic or keyword</text>

    <rect x="40" y="144" width="340" height="62" rx="9" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="58" y="168" font-size="14" font-weight="700" fill="#1e1b4b">2 · FILTERING</text>
    <text x="58" y="189" font-size="12.5" fill="#3730a3">language · publisher country · topic</text>

    <rect x="40" y="232" width="340" height="62" rx="9" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="58" y="256" font-size="14" font-weight="700" fill="#1e1b4b">3 · TOPIC CLUSTERING</text>
    <text x="58" y="277" font-size="12.5" fill="#3730a3">broad subject areas — “German energy policy”</text>

    <rect x="40" y="320" width="340" height="62" rx="9" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="58" y="344" font-size="14" font-weight="700" fill="#1e1b4b">4 · ARTICLE CLUSTERING</text>
    <text x="58" y="365" font-size="12.5" fill="#3730a3">within a topic → same-event stories</text>

    <rect x="40" y="408" width="340" height="62" rx="9" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="58" y="432" font-size="14" font-weight="700" fill="#1e1b4b">4b · PARTITION EACH STORY</text>
    <text x="58" y="453" font-size="12.5" fill="#3730a3">by stance · country · language</text>

    <rect x="40" y="496" width="340" height="52" rx="9" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="58" y="527" font-size="14" font-weight="700" fill="#1e3a8a">5 · DOWNSTREAM TASKS</text>
  </g>

  <!-- vertical arrows -->
  <g stroke="#64748b" stroke-width="2" marker-end="url(#a)" fill="none">
    <path d="M210 118 V140"/>
    <path d="M210 206 V228"/>
    <path d="M210 294 V316"/>
    <path d="M210 382 V404"/>
    <path d="M210 470 V492"/>
  </g>

  <!-- warnings -->
  <g>
    <rect x="470" y="312" width="450" height="66" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="488" y="336" font-size="13" font-weight="700" fill="#7c2d12">⚠ Ground News TRANSLATES here</text>
    <text x="488" y="357" font-size="12" fill="#9a3412">…then clusters the English text. Entities are lost:</text>
    <text x="488" y="372" font-size="12" fill="#9a3412">“Neuer” → “new”, “Bayern” → “Bavaria”, “USA” → “Us”</text>

    <rect x="470" y="400" width="450" height="66" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="488" y="424" font-size="13" font-weight="700" fill="#7c2d12">⚠ Labels attach here — at OUTLET level</text>
    <text x="488" y="445" font-size="12" fill="#9a3412">No provider rates individual articles. Every Fox News</text>
    <text x="488" y="460" font-size="12" fill="#9a3412">article is “right” because Fox is rated right.</text>
  </g>
  <g stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aw)" fill="none">
    <path d="M470 345 H392"/>
    <path d="M470 433 H392"/>
  </g>

  <!-- tasks -->
  <g>
    <rect x="470" y="496" width="450" height="164" rx="9" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
    <text x="488" y="520" font-size="13" font-weight="700" fill="#064e3b">The five tasks are distinct</text>
    <text x="488" y="545" font-size="12.5" fill="#065f46">1 · article summarisation</text>
    <text x="742" y="545" font-size="12.5" font-weight="600" fill="#047857">ready now</text>
    <text x="488" y="567" font-size="12.5" fill="#065f46">2 · topic summarisation</text>
    <text x="742" y="567" font-size="12.5" font-weight="600" fill="#a16207">needs a join</text>
    <text x="488" y="589" font-size="12.5" fill="#065f46">3 · stance summary</text>
    <text x="742" y="589" font-size="12.5" font-weight="600" fill="#a16207">no bodies</text>
    <text x="488" y="611" font-size="12.5" fill="#065f46">4 · stance comparison</text>
    <text x="742" y="611" font-size="12.5" font-weight="600" fill="#a16207">no bodies</text>
    <text x="488" y="633" font-size="12.5" fill="#065f46">5 · stance prediction</text>
    <text x="742" y="633" font-size="12.5" font-weight="600" fill="#b91c1c">blocked — labels</text>
  </g>
  <path d="M380 522 H462" stroke="#64748b" stroke-width="2" marker-end="url(#a)" fill="none"/>
</svg>
